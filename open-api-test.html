<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open API Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { min-height: 150px; }
        button { padding: 10px 15px; cursor: pointer; }
        pre { background-color: #f4f4f4; padding: 10px; border: 1px solid #ddd; white-space: pre-wrap; word-wrap: break-word; }
        #requestBodyContainer { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Open API Test Client</h1>

    <div class="form-group">
        <label for="apiUrl">API URL</label>
        <input type="text" id="apiUrl" value="http://localhost:8848/open-api/v1/test">
    </div>

    <div class="form-group">
        <label for="method">Method</label>
        <select id="method" onchange="toggleRequestBody()">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>
    </div>

    <div class="form-group">
        <label for="appId">App ID</label>
        <input type="text" id="appId" placeholder="Enter App ID" value="35132c87db1f4243923b4049ef37a9df">
    </div>

    <div class="form-group">
        <label for="appKey">App Key</label>
        <input type="text" id="appKey" placeholder="Enter App Key" value="252aee07f3044d609e340f2c50a38e7a">
    </div>

    <div class="form-group">
        <label for="appSecret">App Secret</label>
        <input type="text" id="appSecret" placeholder="Enter App Secret" value="YgJ54xFUFKvN/pZHUJ8cTDwXGr9tat7//AVLZdRWE5Y=">
    </div>

    <div class="form-group" id="requestBodyContainer">
        <label for="requestBody">Request Body (JSON)</label>
        <textarea id="requestBody" placeholder='''{"key": "value"}'''></textarea>
    </div>

    <button onclick="sendRequest()">Send Request</button>

    <h2>Request Details</h2>
    <pre id="requestDetails"></pre>

    <h2>Response</h2>
    <pre id="response"></pre>
</div>

<script>
    function toggleRequestBody() {
        const method = document.getElementById('method').value;
        const requestBodyContainer = document.getElementById('requestBodyContainer');
        if (method === 'POST' || method === 'PUT') {
            requestBodyContainer.style.display = 'block';
        } else {
            requestBodyContainer.style.display = 'none';
        }
    }

    async function sendRequest() {
        const apiUrl = document.getElementById('apiUrl').value;
        const method = document.getElementById('method').value;
        const requestBody = document.getElementById('requestBody').value;
        const appId = document.getElementById('appId').value;
        const appKey = document.getElementById('appKey').value;
        const appSecret = document.getElementById('appSecret').value;
        const responseEl = document.getElementById('response');
        const requestDetailsEl = document.getElementById('requestDetails');

        responseEl.textContent = 'Sending...';
        requestDetailsEl.textContent = '';

        if (!apiUrl || !appId || !appKey || !appSecret) {
            responseEl.textContent = 'Error: Please fill in all fields.';
            return;
        }

        try {
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const nonce = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            
            const url = new URL(apiUrl);
            const path = url.pathname;
            const queryString = url.search ? url.search.substring(1) : '';

            // Per user instruction, do not modify the signature generation logic.
            // The request body is NOT included in the signature. This may or may not work depending on server implementation.
            const stringToSign = appKey + timestamp + nonce + path + (queryString ? '?' + queryString : '');

            const signature = await hmacSha256(appSecret, stringToSign);

            const headers = {
                'X-App-Id': appId,
                'X-App-Key': appKey,
                'X-Timestamp': timestamp,
                'X-Nonce': nonce,
                'X-Signature': signature
            };

            const fetchOptions = {
                method: method,
                headers: headers
            };

            let requestBodyForDisplay = 'N/A';
            if (method === 'POST' || method === 'PUT') {
                headers['Content-Type'] = 'application/json';
                fetchOptions.body = requestBody;
                try {
                    // For display purposes, format the JSON nicely.
                    requestBodyForDisplay = JSON.stringify(JSON.parse(requestBody), null, 2);
                } catch (e) {
                    // If body is not valid JSON, display as is.
                    requestBodyForDisplay = requestBody;
                }
            }

            requestDetailsEl.textContent = `URL: ${apiUrl}
` + 
                                           `Method: ${method}
` + 
                                           `Headers:
${JSON.stringify(headers, null, 2)}

` +
                                           `Body:
${requestBodyForDisplay}

` +
                                           `StringToSign: ${stringToSign}`;

            const res = await fetch(apiUrl, fetchOptions);

            const responseText = await res.text();
            let responseData;
            try {
                // Try to parse as JSON for pretty printing
                responseData = JSON.parse(responseText);
                responseEl.textContent = `Status: ${res.status}

${JSON.stringify(responseData, null, 2)}`;
            } catch (e) {
                // If not JSON, display as plain text
                responseEl.textContent = `Status: ${res.status}

${responseText}`;
            }


        } catch (error) {
            console.error('Error:', error);
            responseEl.textContent = `Error: ${error.message}`;
        }
    }

    async function hmacSha256(secret, message) {
        const encoder = new TextEncoder();
        const key = await window.crypto.subtle.importKey(
            'raw',
            encoder.encode(secret),
            { name: 'HMAC', hash: 'SHA-256' },
            false,
            ['sign']
        );
        const signature = await window.crypto.subtle.sign('HMAC', key, encoder.encode(message));
        return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Initialize view
    document.addEventListener('DOMContentLoaded', function() {
        toggleRequestBody();
    });
</script>

</body>
</html>
